name: Update DSA Progress

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate and update progress
        run: |
          python <<'PY'
          from pathlib import Path

          readme = Path("Pattern/README.md")

          content = readme.read_text(encoding="utf-8")

          lines = content.splitlines()

          completed = 0
          total = 0

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("- [ ] Pattern ") or stripped.startswith("- [x] Pattern ") or stripped.startswith("- [X] Pattern "):
                  total += 1

                  if stripped.startswith("- [x] Pattern ") or stripped.startswith("- [X] Pattern "):
                      completed += 1

          print(f"Completed: {completed}")
          print(f"Total: {total}")
          print(f"Progress: {completed}/{total}")

          # Update progress text
          new_content = content.replace(
              next(
                  line for line in lines
                  if line.strip().startswith("**")
                  and "patterns completed" in line
              ),
              f"**{completed} / {total} patterns completed**"
          )

          readme.write_text(new_content, encoding="utf-8")

          print("README progress updated.")
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Pattern/README.md

          if git diff --cached --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "Update DSA progress"
            git push
          fi