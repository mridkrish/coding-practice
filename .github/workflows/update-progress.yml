name: Update DSA Progress

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-progress:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate and update progress
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          readme = Path("Pattern/README.md")
          content = readme.read_text(encoding="utf-8")

          # Extract only the Progress section
          match = re.search(
              r'## 📊 Progress(.*?)(?=\n## |\Z)',
              content,
              re.DOTALL
          )

          if not match:
              raise Exception("Progress section not found")

          progress_section = match.group(1)

          # Count only Pattern checkboxes inside the Progress section
          completed = len(
              re.findall(
                  r'^- \[x\] Pattern \d+$',
                  progress_section,
                  re.MULTILINE | re.IGNORECASE
              )
          )

          total = len(
              re.findall(
                  r'^- \[[ x]\] Pattern \d+$',
                  progress_section,
                  re.MULTILINE | re.IGNORECASE
              )
          )

          print(f"Completed: {completed}")
          print(f"Total: {total}")
          print(f"Progress: {completed}/{total}")

          # Update progress text
          updated_content = re.sub(
              r'\*\*\d+ / \d+ patterns completed\*\*',
              f'**{completed} / {total} patterns completed**',
              content,
              count=1
          )

          # Update Shields.io progress badge
          updated_content = re.sub(
              r'!\[Progress\]\(https://img\.shields\.io/badge/Progress-[^)]*\)',
              f'![Progress](https://img.shields.io/badge/Progress-{completed}%2F{total}-lightgrey)',
              updated_content,
              count=1
          )

          readme.write_text(updated_content, encoding="utf-8")

          print("README progress updated.")
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Pattern/README.md

          if git diff --cached --quiet; then
            echo "No README changes to commit."
          else
            git commit -m "Update DSA progress"
            git push
          fi